name: Resident agent

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - agent/renderer/**
      - .github/workflows/resident-agent.yml
  pull_request:
    paths:
      - scripts/**
      - agent/renderer/**
      - .github/workflows/resident-agent.yml

permissions:
  contents: read

concurrency:
  group: resident-agent
  cancel-in-progress: false

jobs:
  check:
    name: Check the machinery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node --test scripts/readme-agent.test.mjs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/renderer/go.mod
          cache-dependency-path: agent/renderer/go.sum
      - run: go test ./...
        working-directory: agent/renderer

  heartbeat:
    name: Digging, combobulating, and adjusting slop
    needs: check
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Poll public activity and update the resident agent
        run: node scripts/readme-agent.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/renderer/go.mod
          cache-dependency-path: agent/renderer/go.sum
      - name: Let the resident agent talk to visitors
        run: go run .
        working-directory: agent/renderer
      - name: Leave a small sign of life
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md agent/state.json agent/terminal.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: resident agent heartbeat'
          git push
