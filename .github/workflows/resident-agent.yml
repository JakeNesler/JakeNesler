name: Resident agent

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - .github/workflows/resident-agent.yml
  pull_request:
    paths:
      - scripts/**
      - .github/workflows/resident-agent.yml

permissions:
  contents: read

concurrency:
  group: resident-agent
  cancel-in-progress: false

jobs:
  check:
    name: Check the machinery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/readme-agent.test.mjs

  heartbeat:
    name: Digging, combobulating, and adjusting slop
    needs: check
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Poll public activity and update the resident agent
        run: node scripts/readme-agent.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Leave a small sign of life
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md agent/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: resident agent heartbeat'
          git push
